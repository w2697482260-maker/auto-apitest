[pytest]
# 测试用例路径
testpaths = testcases

# 命令行参数
addopts = -v -s
          --alluredir=reports/allure-results
          --clean-alluredir
          --tb=short

# 标记定义
markers =
    # 端标记
    bos: BOS端测试用例
    admin: Admin端测试用例
    staff: Staff端测试用例

    # 业务线标记
    hk_us: 港美股业务
    unlisted: 未上市业务
    a_stock: A股业务

    # 优先级标记
    smoke: 冒烟测试
    p0: 高优先级
    p1: 中优先级
    p2: 低优先级

    # 测试类型
    regression: 回归测试
    api: 接口测试

# Python文件和类的匹配规则
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 日志配置
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

log_file = reports/logs/pytest.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)s] [%(filename)s:%(lineno)d] %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S
